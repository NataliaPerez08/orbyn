[package]
name = "orbyn"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Open-source infrastructure discovery, dependency mapping, and migration assessment."
license = "Apache-2.0"
repository = "https://github.com/NataliaPerez08/orbyn"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true