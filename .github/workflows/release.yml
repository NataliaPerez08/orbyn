name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
           bin="target/${{ matrix.target }}/release/orbyn${{ matrix.ext }}"
           asset="orbyn-${RELEASE_TAG}-${{ matrix.target }}${{ matrix.ext }}"
           staging="$RUNNER_TEMP/orbyn-package"
           rm -rf "$staging"
           mkdir -p "$staging"
           cp "$bin" "$staging/$asset"
           cp LICENSE THIRD_PARTY_NOTICES.md "$staging/"
           if [ "${{ matrix.os }}" = "windows-latest" ]; then
             (
               cd "$staging"
               7z a "$GITHUB_WORKSPACE/$asset.zip" "$asset" LICENSE THIRD_PARTY_NOTICES.md >/dev/null
             )
             sha256sum "$asset.zip" > "$asset.zip.sha256"
           else
             tar -czf "$asset.tar.gz" -C "$staging" "$asset" LICENSE THIRD_PARTY_NOTICES.md
             sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"
           fi

           if [ "${{ matrix.os }}" = "windows-latest" ]; then
             inspect="$RUNNER_TEMP/orbyn-inspect"
             rm -rf "$inspect"
             mkdir -p "$inspect"
             7z x "$asset.zip" "-o$inspect" >/dev/null
             test -f "$inspect/$asset"
             test -f "$inspect/LICENSE"
             test -f "$inspect/THIRD_PARTY_NOTICES.md"
             sha256sum -c "$asset.zip.sha256"
             test -s "$asset.zip"
           else
             inspect="$RUNNER_TEMP/orbyn-inspect"
             rm -rf "$inspect"
             mkdir -p "$inspect"
             tar -xzf "$asset.tar.gz" -C "$inspect"
             test -f "$inspect/$asset"
             test -f "$inspect/LICENSE"
             test -f "$inspect/THIRD_PARTY_NOTICES.md"
             sha256sum -c "$asset.tar.gz.sha256"
             test -s "$asset.tar.gz"
           fi

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbyn-${{ matrix.target }}
          path: |
            orbyn-*.${{ matrix.ext }}.tar.gz
            orbyn-*.${{ matrix.ext }}.zip
            *.sha256
          if-no-files-found: error

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: orbyn-*
          merge-multiple: true

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'orbyn-*'

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ env.RELEASE_TAG }}
          draft: true
          body: |
            Orbyn ${{ env.RELEASE_TAG }}.

            Install:
            ```bash
            # Linux (x86_64)
            tar -xzf orbyn-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu.tar.gz
            sudo install -m 0755 orbyn-${{ env.RELEASE_TAG }}-x86_64-unknown-linux-gnu /usr/local/bin/orbyn
            ```
            Checksums are in the `*.sha256` files. Verify with:
            ```bash
            sha256sum -c orbyn-${{ env.RELEASE_TAG }}-*.sha256
            ```
          files: |
            orbyn-*
