name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --locked --all-targets

      - name: test
        run: cargo test --locked --all-targets

      - name: release build
        run: cargo build --locked --release

  postgres:
    name: test (postgres store)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbyn
          POSTGRES_PASSWORD: orbyn
          POSTGRES_DB: orbyn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbyn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --locked --all-targets

      # The postgres_store suite skips itself when ORBYN_PG_TEST_URL is
      # unset, so the regular test job stays hermetic.
      - name: test (postgres)
        run: cargo test --locked --test postgres_store
        env:
          ORBYN_PG_TEST_URL: postgres://orbyn:orbyn@localhost:5432/orbyn_test

  windows:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      # E2E suites are Unix-only (shell-script fakes) and compile empty
      # here; this still covers compilation plus the unit and store smoke
      # tests on Windows.
      - name: build
        run: cargo build --locked --all-targets

      - name: test
        run: cargo test --locked --all-targets

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RustSec audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
