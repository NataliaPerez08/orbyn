#cloud-config
# db-01 — Ubuntu 20.04 — PostgreSQL and Redis listening on the lab network.
# The throwaway 'orbyn-lab' password is only valid inside the isolated
# 192.0.2.0/24 demo bridge and never leaves the lab.
users:
  - name: deploy
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - __LAB_KEY__
ssh_pwauth: false
package_update: true
packages:
  - postgresql
  - redis-server
write_files:
  - path: /usr/local/bin/orbyn-db-setup.sh
    permissions: '0755'
    content: |
      #!/bin/sh
      set -e
      PG_MAIN=$(ls -d /etc/postgresql/*/main | head -1)
      sed -i "s/^#listen_addresses.*/listen_addresses = '*'/" "$PG_MAIN/postgresql.conf"
      echo "host all api 192.0.2.0/24 scram-sha-256" >> "$PG_MAIN/pg_hba.conf"
      sed -i 's/^bind 127.0.0.1 ::1/bind 0.0.0.0/' /etc/redis/redis.conf
      sed -i 's/^protected-mode yes/protected-mode no/' /etc/redis/redis.conf
      systemctl restart postgresql redis-server
      sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='api'" | grep -q 1 \
        || sudo -u postgres psql -c "CREATE ROLE api LOGIN PASSWORD 'orbyn-lab'"
      sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='appdb'" | grep -q 1 \
        || sudo -u postgres psql -c "CREATE DATABASE appdb OWNER api"
runcmd:
  - /usr/local/bin/orbyn-db-setup.sh
