# Keep dependency licenses and sources explicit; unknown entries fail CI.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    # Desktop only: the gtk/webkit2gtk stack (cssparser & friends) is
    # MPL-2.0, weak copyleft — fine to link and ship; MPL-covered files
    # stay open.
    "MPL-2.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
ignore = [
    # Desktop only: proc-macro-error (via gtk3-macros) is unmaintained but
    # is a compile-time proc-macro, not shipped; the whole gtk ecosystem
    # rides on it. ponytail: drop when gtk3-macros migrates off it.
    "RUSTSEC-2024-0370",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
