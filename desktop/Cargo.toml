[package]
name = "orbyn-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Orbyn Desktop MVP: read-only Discover/Observe/Export views over the orbyn CLI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "io-util"] }

[profile.release]
lto = true

